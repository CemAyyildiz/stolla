name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install Stellar CLI
        run: cargo install --locked stellar-cli --features opt
      - name: Test contracts
        run: cd contracts && cargo test
      - name: Build contracts
        run: cd contracts && CARGO_TARGET_DIR=target stellar contract build

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci --workspace=web
      - name: Test frontend
        run: npm run test --workspace=web
      - name: Build frontend
        run: npm run build --workspace=web
        env:
          NEXT_PUBLIC_STELLAR_NETWORK: testnet
          NEXT_PUBLIC_STELLAR_RPC_URL: https://soroban-testnet.stellar.org

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Run creation flow at desktop and mobile widths
        run: npm run test:e2e --workspace=web
      - name: Verify a production build rejects the mock wallet
        run: |
          if npm run build --workspace=web; then
            echo "Production build accepted NEXT_PUBLIC_E2E_WALLET" >&2
            exit 1
          fi
        env:
          NEXT_PUBLIC_E2E_WALLET: mock
          NEXT_PUBLIC_STELLAR_NETWORK: testnet
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
